<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Offline Maps — 3D map demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root {
    --paper: #f7f4ee;
    --surface: #fffdf9;
    --surface-2: #f1ece2;
    --border: rgba(28, 25, 20, 0.12);
    --border-strong: rgba(28, 25, 20, 0.22);
    --ink: #1c1914;
    --ink-dim: #6b6459;
    --accent: #0e7490;
    --accent-soft: rgba(14, 116, 144, 0.10);
    --accent-2: #9a3412;
    --ok: #15803d;
    --warn: #b45309;
    --bad: #b91c1c;
    --shadow: 0 1px 2px rgba(28,25,20,.06), 0 8px 24px rgba(28,25,20,.10);
    --radius: 16px;
    --font: "IBM Plex Sans", ui-sans-serif, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --nav-h: 62px;
  }
  html[data-theme="dark"] {
    --paper: #0f1419;
    --surface: #161d24;
    --surface-2: #1d262e;
    --border: rgba(255, 255, 255, 0.09);
    --border-strong: rgba(255, 255, 255, 0.18);
    --ink: #e8eef3;
    --ink-dim: #93a1ad;
    --accent: #38bdf8;
    --accent-soft: rgba(56, 189, 248, 0.12);
    --accent-2: #fb923c;
    --ok: #4ade80;
    --warn: #fbbf24;
    --bad: #f87171;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; height: 100dvh; margin: 0; }
  body {
    font-family: var(--font);
    background: var(--paper);
    color: var(--ink);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #map { position: fixed; inset: 0; }
  .maplibregl-ctrl-attrib { font-family: var(--mono); font-size: 10px; }
  .maplibregl-ctrl-bottom-left, .maplibregl-ctrl-bottom-right { display: none; }

  /* ---------- floating chrome ---------- */
  .chrome { position: fixed; z-index: 5; }

  .topbar {
    top: 0; left: 0; right: 0;
    padding: 14px 14px 0;
    display: flex; flex-direction: column; gap: 8px;
    pointer-events: none;
  }
  .topbar > * { pointer-events: auto; }

  .searchbar {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    box-shadow: var(--shadow);
    padding: 11px 16px;
    max-width: 560px;
    margin: 0 auto;
    width: 100%;
  }
  .searchbar svg { flex: none; opacity: .55; }
  .searchbar input {
    flex: 1; min-width: 0;
    border: 0; outline: 0; background: transparent;
    font: 500 15px/1.2 var(--font);
    color: var(--ink);
  }
  .searchbar input::placeholder { color: var(--ink-dim); font-weight: 400; }
  .kbd {
    font: 500 10px/1 var(--mono);
    color: var(--ink-dim);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 3px 5px;
  }

  .chips { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font: 500 11px/1 var(--mono);
    letter-spacing: .02em;
    padding: 6px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-dim);
    box-shadow: 0 1px 2px rgba(0,0,0,.05);
    white-space: nowrap;
  }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-dim); }
  .chip.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 30%, transparent); }
  .chip.ok .dot { background: var(--ok); }
  .chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 34%, transparent); }
  .chip.warn .dot { background: var(--warn); }
  .chip.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 34%, transparent); }
  .chip.bad .dot { background: var(--bad); }

  /* right-hand map controls */
  .controls {
    right: 14px;
    top: 50%;
    transform: translateY(-58%);
    display: flex; flex-direction: column; gap: 8px;
  }
  .ctl {
    width: 44px; height: 44px;
    display: grid; place-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 13px;
    box-shadow: var(--shadow);
    color: var(--ink);
    cursor: pointer;
    transition: transform .12s ease, background .12s ease, color .12s ease;
  }
  .ctl:hover { background: var(--surface-2); }
  .ctl:active { transform: scale(.94); }
  .ctl.active { background: var(--accent); color: #fff; border-color: transparent; }
  html[data-theme="dark"] .ctl.active { color: #06121a; }
  .ctl svg { width: 20px; height: 20px; }
  .ctl .label { font: 600 10px/1 var(--mono); letter-spacing: .04em; }
  body.sheet-open .controls { opacity: 0; pointer-events: none; }
  .controls { transition: opacity .18s ease; }

  /* ---------- bottom sheet + nav ---------- */
  .sheet {
    left: 0; right: 0; bottom: var(--nav-h);
    max-height: 62vh;
    background: var(--surface);
    border-top: 1px solid var(--border);
    border-radius: 22px 22px 0 0;
    box-shadow: 0 -12px 40px rgba(0,0,0,.16);
    display: flex; flex-direction: column;
    transform: translateY(calc(100% + 12px));
    transition: transform .28s cubic-bezier(.22,.8,.28,1), opacity .2s ease, visibility .2s;
    z-index: 6;
    /* Fully removed from the page when closed: it must not extend the scroll area, and it
       must not be reachable by keyboard or a screen reader while hidden. */
    opacity: 0;
    visibility: hidden;
  }
  .sheet.open { transform: translateY(0); opacity: 1; visibility: visible; }
  .sheet__grab {
    width: 42px; height: 4px; border-radius: 999px;
    background: var(--border-strong);
    margin: 9px auto 4px;
  }
  .sheet__head {
    display: flex; align-items: baseline; gap: 10px;
    padding: 4px 18px 10px;
    border-bottom: 1px solid var(--border);
  }
  .sheet__head h2 {
    font: 600 15px/1.2 var(--font);
    margin: 0; letter-spacing: -.01em;
  }
  .sheet__head .meta {
    font: 500 10px/1 var(--mono);
    color: var(--ink-dim);
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .sheet__body { overflow-y: auto; padding: 10px 14px 18px; -webkit-overflow-scrolling: touch; }

  nav.bottom {
    left: 0; right: 0; bottom: 0;
    height: var(--nav-h);
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    display: grid; grid-template-columns: repeat(5, 1fr);
    z-index: 7;
  }
  .tab {
    border: 0; background: transparent; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    color: var(--ink-dim);
    font: 500 10px/1 var(--mono);
    letter-spacing: .03em;
    padding: 0;
  }
  .tab svg { width: 21px; height: 21px; }
  .tab[aria-selected="true"] { color: var(--accent); }
  .tab[aria-selected="true"] .ind {
    width: 16px; height: 2px; border-radius: 2px; background: var(--accent); margin-top: 1px;
  }

  /* ---------- content bits ---------- */
  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 8px;
    border-radius: 12px;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .row:hover { background: var(--surface-2); }
  .row + .row { border-top: 1px solid var(--border); border-radius: 0; }
  .row__main { flex: 1; min-width: 0; }
  .row__title { font: 600 14px/1.3 var(--font); margin: 0; }
  .row__sub { font: 400 12px/1.35 var(--font); color: var(--ink-dim); margin: 2px 0 0; }
  .row__meta { font: 500 10px/1.4 var(--mono); color: var(--ink-dim); text-align: right; white-space: nowrap; }
  .badge {
    font: 600 9px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase;
    padding: 4px 7px; border-radius: 5px;
    background: var(--accent-soft); color: var(--accent);
  }
  .badge.muted { background: var(--surface-2); color: var(--ink-dim); }
  .badge.warn { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); }

  .section-label {
    display: flex; align-items: center; gap: 8px;
    font: 600 10px/1 var(--mono);
    letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-dim);
    margin: 16px 8px 6px;
  }
  .section-label::before {
    content: ""; width: 6px; height: 6px; border-radius: 2px; background: var(--accent);
  }
  .note {
    font: 400 12.5px/1.55 var(--font);
    color: var(--ink-dim);
    margin: 6px 8px 10px;
  }
  .note strong { color: var(--ink); font-weight: 600; }
  code {
    font: 500 11.5px/1.4 var(--mono);
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 1px 5px; border-radius: 5px;
    overflow-wrap: anywhere;
  }
  .btn {
    font: 600 12.5px/1 var(--font);
    padding: 9px 14px; border-radius: 10px;
    border: 1px solid var(--border-strong);
    background: var(--surface); color: var(--ink);
    cursor: pointer;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
  html[data-theme="dark"] .btn.primary { color: #06121a; }
  .btn.small { padding: 6px 10px; font-size: 11.5px; }
  .btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }

  .field { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 8px; }
  .field + .field { border-top: 1px solid var(--border); }
  .field__label { font: 500 13px/1.3 var(--font); }
  .field__hint { font: 400 11.5px/1.4 var(--font); color: var(--ink-dim); margin-top: 2px; }
  .switch { position: relative; width: 44px; height: 26px; flex: none; }
  .switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .switch span {
    position: absolute; inset: 0; border-radius: 999px;
    background: var(--border-strong); transition: background .18s ease;
  }
  .switch span::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.25);
    transition: transform .18s ease;
  }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(18px); }
  input[type="range"] { width: 130px; accent-color: var(--accent); }

  .empty {
    text-align: center; padding: 26px 16px; color: var(--ink-dim);
    font: 400 13px/1.6 var(--font);
  }

  .toast {
    position: fixed; left: 50%; bottom: calc(var(--nav-h) + 14px);
    transform: translate(-50%, 20px);
    background: var(--ink); color: var(--paper);
    font: 500 12.5px/1.3 var(--font);
    padding: 10px 16px; border-radius: 999px;
    box-shadow: var(--shadow);
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    z-index: 20; max-width: min(90vw, 460px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .banner {
    position: fixed; left: 14px; right: 14px; top: 96px;
    background: var(--surface);
    border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent);
    border-left: 3px solid var(--warn);
    border-radius: 12px;
    padding: 12px 14px;
    box-shadow: var(--shadow);
    font: 400 12.5px/1.55 var(--font);
    color: var(--ink);
    z-index: 9; display: none;
  }
  .banner.show { display: block; }
  .banner strong { font-weight: 600; }
  .banner .close {
    position: absolute; top: 8px; right: 10px;
    border: 0; background: transparent; color: var(--ink-dim);
    font: 500 16px/1 var(--mono); cursor: pointer;
  }

  .pin-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
    flex: none;
  }

  /* Rows with a meta column and buttons get cramped on phones: drop the tile count and let the
     action group wrap under the text instead of squeezing it. */
  .row__meta .tiles { display: block; }
  @media (max-width: 480px) {
    .row__meta .tiles { display: none; }
    .row--stack { flex-wrap: wrap; }
    .row--stack .row__main { flex-basis: 100%; }
    .row--stack .row__actions { margin-left: auto; display: flex; gap: 6px; padding-top: 6px; }
    .row__sub { font-size: 11.5px; }
  }

  @media (max-width: 560px) {
    .controls { top: auto; bottom: calc(var(--nav-h) + 12px); transform: none; right: 12px; }
    .sheet { max-height: 58vh; }
    .chips { justify-content: flex-start; overflow-x: auto; padding-bottom: 2px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
<style id="liquid-glass">
/* ===== Liquid glass + depth + spring motion (override layer) ===== */
:root{
  --nav-h: calc(90px + env(safe-area-inset-bottom,0px));
  --spring: cubic-bezier(.34,1.56,.64,1);
  --tx:0; --ty:0;
  --glass: linear-gradient(135deg, rgba(255,255,255,.58), rgba(255,255,255,.20));
  --glass-strong: linear-gradient(150deg, rgba(255,255,255,.80), rgba(255,255,255,.48));
  --rim: rgba(255,255,255,.95);
  --spec: rgba(255,255,255,.70);
  --glass-shadow:
    0 1px 1px rgba(20,30,50,.06), 0 4px 8px rgba(20,30,50,.08),
    0 14px 28px rgba(20,30,50,.12), 0 32px 60px rgba(20,30,50,.14),
    inset 0 1px 1px rgba(255,255,255,.9), inset 0 -10px 18px rgba(255,255,255,.14),
    inset 0 0 22px rgba(255,255,255,.22);
}
html[data-theme="dark"]{
  --glass: linear-gradient(135deg, rgba(70,92,114,.46), rgba(22,30,40,.26));
  --glass-strong: linear-gradient(150deg, rgba(42,58,74,.80), rgba(18,26,36,.62));
  --rim: rgba(255,255,255,.42);
  --spec: rgba(255,255,255,.24);
  --glass-shadow:
    0 1px 1px rgba(0,0,0,.30), 0 4px 8px rgba(0,0,0,.28),
    0 14px 28px rgba(0,0,0,.34), 0 32px 60px rgba(0,0,0,.42),
    inset 0 1px 1px rgba(255,255,255,.24), inset 0 -10px 18px rgba(255,255,255,.04),
    inset 0 0 22px rgba(255,255,255,.05);
}

/* glass surface */
.searchbar,.chip,.ctl,.sheet,nav.bottom{
  isolation:isolate;
  background:var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(190%) brightness(1.04);
  backdrop-filter:blur(22px) saturate(190%) brightness(1.04);
  border:1px solid transparent;
  box-shadow:var(--glass-shadow);
}
.searchbar,.chip,.ctl{position:relative}
/* specular light that follows the pointer / device tilt */
.searchbar::before,.chip::before,.ctl::before,.sheet::before,nav.bottom::before{
  content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;opacity:.85;
  background:radial-gradient(120% 80% at calc(50% + var(--tx)*35%) calc(-10% + var(--ty)*18%), var(--spec), transparent 58%);
}
/* refractive rim */
.searchbar::after,.chip::after,.ctl::after,.sheet::after,nav.bottom::after{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;z-index:-1;pointer-events:none;opacity:.9;
  background:linear-gradient(calc(135deg + var(--tx)*25deg), var(--rim), rgba(255,255,255,0) 38%, rgba(255,255,255,0) 62%, var(--rim));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
}

/* 4D depth: perspective tilt + parallax shift (3D) driven by pointer/tilt (time/motion) */
.searchbar,.chip,.ctl,nav.bottom{
  transform:perspective(800px) rotateX(calc(var(--ty)*-5deg)) rotateY(calc(var(--tx)*7deg));
  translate:calc(var(--tx)*var(--d,6)*-1px) calc(var(--ty)*var(--d,6)*-1px);
  scale:var(--s,1);
  transition:transform .4s cubic-bezier(.22,1,.36,1), translate .4s cubic-bezier(.22,1,.36,1),
             scale .55s var(--spring), box-shadow .3s ease, background .25s ease, color .2s ease;
}
.chip{--d:12} .ctl{--d:10} .searchbar{--d:6} nav.bottom{--d:5}
.searchbar:focus-within{--s:1.025}
.ctl:active{--s:.88}
@media (hover:hover){ .ctl:hover{--s:1.1} }
.ctl.active{background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent))}
.chip{border-color:rgba(255,255,255,.0)}

/* entrance pop */
.searchbar,.chip,.ctl,nav.bottom{animation:pop .9s var(--spring) backwards}
.chip:nth-child(2){animation-delay:.1s}.chip:nth-child(3){animation-delay:.2s}
.ctl:nth-child(1){animation-delay:.15s}.ctl:nth-child(2){animation-delay:.21s}.ctl:nth-child(3){animation-delay:.27s}
.ctl:nth-child(4){animation-delay:.33s}.ctl:nth-child(5){animation-delay:.39s}
nav.bottom{animation-delay:.1s}
@keyframes pop{from{opacity:0;scale:.7}}

/* controls bounce away when the sheet opens */
.controls{transition:opacity .25s ease, scale .6s var(--spring)}
body.sheet-open .controls{scale:.8}

/* ---------- bottom sheet: bounce open / bounce close ---------- */
.sheet{
  position:fixed;left:10px;right:10px;bottom:var(--nav-h);
  max-width:640px;margin-inline:auto;
  border-radius:30px;overflow:hidden;
  background:var(--glass-strong);
  transform-origin:50% 100%;
  transform:perspective(1100px) translate3d(0,calc(115% + var(--dy,0px)),0) rotateX(16deg) scale(.92);
  opacity:0;visibility:hidden;
  /* close: pulls back, then drops (ease-in-back) */
  transition:transform .5s cubic-bezier(.36,0,.66,-.56), opacity .28s ease .14s, visibility 0s linear .5s;
}
.sheet.open{
  transform:perspective(1100px) translate3d(0,var(--dy,0px),0) rotateX(calc(var(--ty)*-1.6deg)) rotateY(calc(var(--tx)*2.2deg)) scale(1);
  opacity:1;visibility:visible;
  /* open: overshoots, then settles */
  transition:transform .85s var(--spring), opacity .25s ease, visibility 0s;
}
.sheet.dragging{transition:none}
.sheet__grab{width:44px;height:5px;margin:10px auto 6px;cursor:grab;touch-action:none}
.sheet__head{touch-action:none;cursor:grab}
.sheet__body.stagger>*{animation:rise .75s var(--spring) backwards;animation-delay:calc(var(--n,0)*45ms + 60ms)}
@keyframes rise{from{opacity:0;transform:translate(calc(var(--dir,0)*30px),18px) scale(.94)}}

/* ---------- floating glass nav + liquid sliding pill ---------- */
nav.bottom{
  position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));
  max-width:520px;margin-inline:auto;height:66px;padding:6px;border-radius:33px;
}
.nav-pill{
  position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);
  border-radius:27px;z-index:-1;pointer-events:none;
  translate:calc(var(--i,0)*100%) 0;
  background:linear-gradient(180deg,rgba(255,255,255,.88),rgba(255,255,255,.4));
  box-shadow:0 6px 18px rgba(14,116,144,.28),0 0 0 1px rgba(255,255,255,.55),
             inset 0 1px 1px #fff, inset 0 -3px 8px rgba(14,116,144,.16);
  transition:translate .65s cubic-bezier(.34,1.45,.5,1), scale .5s var(--spring), opacity .3s ease;
}
html[data-theme="dark"] .nav-pill{
  background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.08));
  box-shadow:0 6px 18px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.2),inset 0 1px 1px rgba(255,255,255,.4);
}
body:not(.sheet-open) .nav-pill{opacity:.55;scale:.92}
body .nav-pill.stretch{scale:1.38 .86}
.tab{border-radius:24px;-webkit-tap-highlight-color:transparent;transition:color .25s ease}
.tab .ind{display:none}
.tab svg{transition:scale .4s var(--spring)}
.tab:active svg{scale:.8}
.tab[aria-selected="true"] svg{animation:tabBounce .7s var(--spring)}
@keyframes tabBounce{0%{translate:0 0;scale:1}35%{translate:0 -7px;scale:1.24}65%{translate:0 1px;scale:.94}100%{translate:0 0;scale:1}}

/* ---------- toast / banner / small controls ---------- */
.toast{
  background:rgba(18,24,32,.58);color:#fff;
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,.25);box-shadow:var(--glass-shadow);
  transform:translate(-50%,36px) scale(.8);
  transition:opacity .25s ease, transform .6s var(--spring);
}
.toast.show{transform:translate(-50%,0) scale(1)}
.banner{
  background:var(--glass-strong);border-radius:20px;box-shadow:var(--glass-shadow);
  -webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);
}
.banner.show{animation:bannerIn .75s var(--spring)}
@keyframes bannerIn{from{opacity:0;transform:translateY(-26px) scale(.9)}}
.row{transition:background .2s ease, scale .45s var(--spring)}
.row:hover{background:color-mix(in srgb,var(--surface) 55%,transparent)}
.row:active{scale:.98}
.btn{
  background:color-mix(in srgb,var(--surface) 45%,transparent);
  border-color:rgba(255,255,255,.55);

  transition:scale .45s var(--spring), background .2s ease;
}
.btn:active{scale:.92}

@media (max-width:560px){ .sheet{max-height:58vh} }

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
"use strict";

/* ------------------------------------------------------------------------------------------
   Offline Maps — browser demo.

   This page is a companion to the Android app in the same repository. It shares the app's
   generated-style approach (no hosted style file: the layer list is built here, exactly as
   MapStyleFactory.kt does on the device), the same places pack, and the same region catalogue.

   What is genuinely the same as the app:
     · the vector style, 3D building extrusions and terrain DEM
     · the search data (256 real OSM places in Andorra) and the ranking
     · the tile-count and download-size arithmetic (TileMath / TileRegionEstimator)
     · saved places, stored locally in this browser

   What is device-only, and is labelled as such in the UI: caching tiles into an offline
   store, and turn-by-turn routing (a phone cannot build a routing graph, so the app loads a
   pre-built one).
   ------------------------------------------------------------------------------------------ */

const PLACES = __PLACES__;
const REGIONS = __REGIONS__;

const VECTOR_TILES = "https://tiles.openfreemap.org/planet/{z}/{x}/{y}.pbf";
const TERRAIN_TILES = "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png";

const state = {
  theme: localStorage.getItem("om.theme") || "light",
  threeD: localStorage.getItem("om.3d") !== "0",
  buildings: localStorage.getItem("om.buildings") !== "0",
  terrain: localStorage.getItem("om.terrain") !== "0",
  exaggeration: Number(localStorage.getItem("om.exaggeration") || 1.2),
  tab: "explore",
  query: "",
  saved: JSON.parse(localStorage.getItem("om.saved") || "[]"),
  userLocation: null,
  mapReady: false,
  // Mirrors the app: quality presets, download policy, installed regions, nav profile.
  quality: localStorage.getItem("om.quality") || "high",
  voice: localStorage.getItem("om.voice") !== "0",
  wifiOnly: localStorage.getItem("om.wifiOnly") !== "0",
  storageLimitMb: Number(localStorage.getItem("om.storageLimit") || 4096),
  installed: JSON.parse(localStorage.getItem("om.installed") || "[]"),
  destination: null,
  profile: "car",
};

/* Same numbers as GraphicsQuality in the app: max pitch and the zoom at which buildings appear. */
const QUALITY = {
  low:    { label: "Low",    pitch: 30, minZoom: 15 },
  medium: { label: "Medium", pitch: 50, minZoom: 14 },
  high:   { label: "High",   pitch: 65, minZoom: 13 },
};
const PROFILES = { car: "Drive", bike: "Cycle", foot: "Walk" };
const SAVED_LABELS = ["Home", "Work", "School", "Saved place"];
const quality = () => QUALITY[state.quality] || QUALITY.high;

document.documentElement.dataset.theme = state.theme;

/* ---------------------------------- style ---------------------------------- */

function palette() {
  const dark = state.theme === "dark";
  return dark
    ? { bg: "#0f1419", water: "#0d1f2d", waterLine: "#16344a", land: "#141b21", landAlt: "#172029",
        park: "#12251a", road: "#2b3640", roadMajor: "#3b4a56", roadLabel: "#93a1ad",
        building: "#1f2933", buildingTop: "#2a3742", label: "#dbe6ef", labelHalo: "#0f1419",
        boundary: "#3d4d5a" }
    : { bg: "#f7f4ee", water: "#a9cbe8", waterLine: "#8fb8da", land: "#f2eee6", landAlt: "#ece7dc",
        park: "#d8e8d2", road: "#ffffff", roadMajor: "#fdf6e3", roadLabel: "#6b6459",
        building: "#e3dcd0", buildingTop: "#d9d1c3", label: "#1c1914", labelHalo: "#fffdf9",
        boundary: "#c9c0b1" };
}

const buildingHeight = ["coalesce", ["get", "render_height"], ["*", ["coalesce", ["get", "levels"], 3], 3], 4];

function buildStyle() {
  const p = palette();
  const layers = [
    { id: "bg", type: "background", paint: { "background-color": p.bg } },
    { id: "landcover", type: "fill", source: "osm", "source-layer": "landcover",
      paint: { "fill-color": p.landAlt, "fill-opacity": 0.6 } },
    { id: "landuse", type: "fill", source: "osm", "source-layer": "landuse",
      paint: { "fill-color": p.land, "fill-opacity": 0.5 } },
    { id: "park", type: "fill", source: "osm", "source-layer": "park",
      paint: { "fill-color": p.park, "fill-opacity": 0.75 } },
    { id: "water", type: "fill", source: "osm", "source-layer": "water",
      paint: { "fill-color": p.water } },
    { id: "waterway", type: "line", source: "osm", "source-layer": "waterway",
      paint: { "line-color": p.waterLine, "line-width": ["interpolate", ["linear"], ["zoom"], 8, 0.5, 16, 2.5] } },
    { id: "boundary", type: "line", source: "osm", "source-layer": "boundary",
      filter: ["==", ["get", "admin_level"], 2],
      paint: { "line-color": p.boundary, "line-width": 1.2, "line-dasharray": [3, 2] } },
    { id: "road-minor", type: "line", source: "osm", "source-layer": "transportation",
      filter: ["in", ["get", "class"], ["literal", ["minor", "service", "track", "path"]]],
      paint: { "line-color": p.road, "line-width": ["interpolate", ["linear"], ["zoom"], 12, 0.6, 17, 4] } },
    { id: "road-major", type: "line", source: "osm", "source-layer": "transportation",
      filter: ["in", ["get", "class"], ["literal", ["primary", "secondary", "tertiary", "trunk", "motorway"]]],
      paint: { "line-color": p.roadMajor, "line-width": ["interpolate", ["linear"], ["zoom"], 8, 1, 17, 8] } },
    { id: "building-flat", type: "fill", source: "osm", "source-layer": "building", minzoom: quality().minZoom,
      paint: { "fill-color": p.building, "fill-opacity": ["interpolate", ["linear"], ["zoom"], 13, 0, 14, 0.85] } },
  ];

  if (state.buildings) {
    layers.push({
      id: "building-3d", type: "fill-extrusion", source: "osm", "source-layer": "building", minzoom: quality().minZoom,
      paint: {
        "fill-extrusion-color": ["interpolate", ["linear"], ["coalesce", ["get", "render_height"], 4],
          0, p.building, 12, p.buildingTop, 40, p.building],
        "fill-extrusion-height": buildingHeight,
        "fill-extrusion-base": ["coalesce", ["get", "render_min_height"], 0],
        "fill-extrusion-opacity": 0.92,
        "fill-extrusion-vertical-gradient": true,
      },
    });
  }

  layers.push(
    { id: "place-city", type: "symbol", source: "osm", "source-layer": "place",
      filter: ["in", ["get", "class"], ["literal", ["city", "town"]]],
      layout: { "text-field": ["get", "name"], "text-font": ["Noto Sans Regular"], "text-size": 14, "text-anchor": "top", "text-offset": [0, 0.6] },
      paint: { "text-color": p.label, "text-halo-color": p.labelHalo, "text-halo-width": 1.4 } },
    { id: "place-village", type: "symbol", source: "osm", "source-layer": "place",
      filter: ["in", ["get", "class"], ["literal", ["village", "hamlet"]]], minzoom: 10,
      layout: { "text-field": ["get", "name"], "text-font": ["Noto Sans Regular"], "text-size": 11.5, "text-anchor": "top", "text-offset": [0, 0.5] },
      paint: { "text-color": p.roadLabel, "text-halo-color": p.labelHalo, "text-halo-width": 1.2 } },
    { id: "road-label", type: "symbol", source: "osm", "source-layer": "transportation", minzoom: 14,
      filter: ["has", "name"],
      layout: { "text-field": ["get", "name"], "text-font": ["Noto Sans Regular"], "text-size": 10.5,
                "symbol-placement": "line", "text-padding": 2 },
      paint: { "text-color": p.roadLabel, "text-halo-color": p.labelHalo, "text-halo-width": 1.2 } },
  );

  const style = {
    version: 8,
    glyphs: "https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf",
    sources: {
      osm: { type: "vector", tiles: [VECTOR_TILES], maxzoom: 14,
             attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors · tiles OpenFreeMap' },
    },
    layers,
  };

  if (state.terrain) {
    style.sources.terrain = { type: "raster-dem", tiles: [TERRAIN_TILES], tileSize: 256, maxzoom: 12,
                              encoding: "terrarium", attribution: "Terrain: Mapzen / AWS Open Data" };
    style.terrain = { source: "terrain", exaggeration: state.exaggeration };
    style.layers.splice(1, 0, {
      id: "hillshade", type: "hillshade", source: "terrain",
      paint: { "hillshade-exaggeration": 0.28, "hillshade-shadow-color": state.theme === "dark" ? "#000" : "#7a6a55" },
    });
  }

  return style;
}

/* ---------------------------------- map ---------------------------------- */

let map;
const FALLBACK_CENTER = { lat: 42.5425, lng: 1.5605 };
const mapAvailable = () => typeof maplibregl !== "undefined";
function viewCentre() {
  if (map) { const c = map.getCenter(); return { lat: c.lat, lng: c.lng }; }
  return FALLBACK_CENTER;
}
let userMarker = null;
let resultMarkers = [];

function initMap() {
  if (!mapAvailable()) {
    document.getElementById("banner").classList.add("show");
    document.getElementById("banner-detail").textContent =
      "The MapLibre GL library could not be loaded from its CDN, so the map canvas is unavailable. " +
      "Search, saved places and the size estimates below still work — they need no map library.";
    setChip("chip-net", "map library blocked", "bad");
    return;
  }
  map = new maplibregl.Map({
    container: "map",
    style: buildStyle(),
    center: [1.5605, 42.5425],
    zoom: 12.4,
    pitch: state.threeD ? 55 : 0,
    bearing: state.threeD ? -18 : 0,
    maxPitch: quality().pitch + 5,
    antialias: true,
    attributionControl: { compact: true },
  });

  map.on("load", () => {
    state.mapReady = true;
    setChip("chip-net", navigator.onLine ? "online tiles" : "offline", navigator.onLine ? "ok" : "warn");
  });

  map.on("error", (e) => {
    const msg = (e && e.error && e.error.message) || "";
    if (msg.includes("tiles") || msg.includes("Failed to fetch") || msg.includes("404") || !state.mapReady) {
      document.getElementById("banner").classList.add("show");
      setChip("chip-net", "tiles unavailable", "bad");
    }
  });

  window.addEventListener("online", () => setChip("chip-net", "online tiles", "ok"));
  window.addEventListener("offline", () => setChip("chip-net", "offline", "warn"));
}

function rebuildStyle() {
  if (!map) return;
  const center = map.getCenter();
  const zoom = map.getZoom();
  const bearing = map.getBearing();
  const pitch = map.getPitch();
  map.setStyle(buildStyle(), { diff: false });
  map.once("styledata", () => {
    map.jumpTo({ center, zoom, bearing, pitch });
    redrawMarkers();
  });
}

/* ---------------------------------- helpers ---------------------------------- */

function toast(message) {
  const el = document.getElementById("toast");
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 2600);
}

function setChip(id, text, kind) {
  const el = document.getElementById(id);
  if (!el) return;
  el.className = "chip" + (kind ? " " + kind : "");
  el.innerHTML = '<span class="dot"></span>' + text;
}

function haversine(a, b) {
  const R = 6371008.8, toRad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * toRad, dLon = (b.lng - a.lng) * toRad;
  const s = Math.sin(dLat / 2) ** 2 +
    Math.cos(a.lat * toRad) * Math.cos(b.lat * toRad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast("Copied " + text);
  } catch {
    // Clipboard API needs a secure context; fall back to a prompt so the value is still reachable.
    prompt("Copy this value", text);
  }
}

function shareLink(lat, lng) {
  return "https://www.openstreetmap.org/?mlat=" + lat.toFixed(5) + "&mlon=" + lng.toFixed(5) +
    "#map=16/" + lat.toFixed(5) + "/" + lng.toFixed(5);
}

function setInstalled(id, on) {
  const next = new Set(state.installed);
  if (on) next.add(id); else next.delete(id);
  state.installed = [...next];
  localStorage.setItem("om.installed", JSON.stringify(state.installed));
  updateCoverageChip();
}

function updateCoverageChip() {
  const n = state.installed.length;
  const label = n === 0 ? "no offline maps yet" : n + (n === 1 ? " region installed" : " regions installed");
  const el = document.getElementById("chip-coverage");
  if (el) {
    el.className = "chip" + (n === 0 ? " warn" : " ok");
    el.innerHTML = '<span class="dot"></span>' + label;
  }
}

function formatDistance(m) {
  if (m < 950) return Math.round(m / 10) * 10 + " m";
  return (m / 1000).toFixed(m < 9500 ? 1 : 0) + " km";
}

/* Tile arithmetic, mirroring TileMath.kt so the size figures match the app. */
function lon2tile(lon, z) { return Math.floor(((lon + 180) / 360) * Math.pow(2, z)); }
function lat2tile(lat, z) {
  const r = (lat * Math.PI) / 180;
  return Math.floor(((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2) * Math.pow(2, z));
}
function tilesForBounds(b, z0, z1) {
  let total = 0;
  for (let z = z0; z <= z1; z++) {
    const x0 = lon2tile(b.w, z), x1 = lon2tile(b.e, z);
    const y0 = lat2tile(b.n, z), y1 = lat2tile(b.s, z);
    total += (Math.abs(x1 - x0) + 1) * (Math.abs(y1 - y0) + 1);
  }
  return total;
}
function estimateBytes(region) {
  const vector = tilesForBounds(region, region.z0, region.z1);
  const dem = tilesForBounds(region, region.z0, Math.min(12, region.z1));
  return vector * 14000 + dem * 48000;
}
function formatBytes(b) {
  if (b < 1024 * 1024) return Math.round(b / 1024) + " KB";
  if (b < 1024 * 1024 * 1024) return (b / (1024 * 1024)).toFixed(b < 10 * 1024 * 1024 ? 1 : 0) + " MB";
  return (b / (1024 * 1024 * 1024)).toFixed(1) + " GB";
}

/* ---------------------------------- search ---------------------------------- */

const TYPE_WEIGHT = { city: 1, town: 2, country: 3, village: 4, suburb: 5, hamlet: 6, neighbourhood: 7, locality: 8, poi: 9 };

function searchPlaces(query, limit = 14) {
  const q = query.trim().toLowerCase();
  if (!q) return [];
  const terms = q.split(/\s+/).filter(Boolean);
  const hits = [];
  for (const p of PLACES) {
    const name = p.n.toLowerCase();
    let score = 0;
    for (const t of terms) {
      const idx = name.indexOf(t);
      if (idx === -1) { score = -1; break; }
      score += idx === 0 ? 40 : 12;
    }
    if (score < 0) continue;
    if (name === q) score += 120;
    score += Math.max(0, 30 - (TYPE_WEIGHT[p.t] || 12) * 2);
    hits.push({ p, score });
  }
  hits.sort((a, b) => b.score - a.score || a.p.n.length - b.p.n.length);
  return hits.slice(0, limit).map((h) => h.p);
}

function nearbyPlaces(limit = 12) {
  const c = viewCentre();
  return PLACES
    .map((p) => ({ p, d: haversine({ lat: c.lat, lng: c.lng }, { lat: p.y, lng: p.x }) }))
    .sort((a, b) => a.d - b.d)
    .slice(0, limit)
    .map((x) => ({ ...x.p, distance: x.d }));
}

/* ---------------------------------- markers ---------------------------------- */

function clearResultMarkers() {
  resultMarkers.forEach((m) => m.remove());
  resultMarkers = [];
}

function showResultsOnMap(places) {
  if (!map || !mapAvailable()) return;
  clearResultMarkers();
  places.slice(0, 8).forEach((p) => {
    const el = document.createElement("div");
    el.className = "pin-dot";
    el.style.cssText = "width:12px;height:12px;border-radius:50%;background:#0e7490;box-shadow:0 0 0 3px rgba(14,116,144,.18)";
    resultMarkers.push(new maplibregl.Marker({ element: el }).setLngLat([p.x, p.y]).addTo(map));
  });
}

function redrawMarkers() {
  if (!map || !mapAvailable()) return;
  state.saved.forEach((s) => {
    const el = document.createElement("div");
    el.style.cssText = "width:14px;height:14px;border-radius:50%;background:#9a3412;box-shadow:0 0 0 4px rgba(154,52,18,.18)";
    new maplibregl.Marker({ element: el }).setLngLat([s.lng, s.lat]).addTo(map);
  });
}

/* ---------------------------------- panels ---------------------------------- */

const sheet = document.getElementById("sheet");
const sheetTitle = document.getElementById("sheet-title");
const sheetMeta = document.getElementById("sheet-meta");
const sheetBody = document.getElementById("sheet-body");
const navEl = document.querySelector("nav.bottom");
const navPill = navEl.querySelector(".nav-pill");
const TAB_ORDER = ["explore", "navigate", "downloads", "saved", "settings"];
function stretchPill() {
  navPill.classList.add("stretch");
  clearTimeout(stretchPill._t);
  stretchPill._t = setTimeout(() => navPill.classList.remove("stretch"), 200);
}

let animateNext = false;
function openSheet(title, meta, html) {
  const wasOpen = sheet.classList.contains("open");
  sheetTitle.textContent = title;
  sheetMeta.textContent = meta || "";
  sheetBody.innerHTML = html;
  sheet.classList.add("open");
  document.body.classList.add("sheet-open");
  if (!wasOpen || animateNext) {
    animateNext = false;
    [...sheetBody.children].slice(0, 12).forEach((c, i) => c.style.setProperty("--n", i));
    sheetBody.classList.remove("stagger");
    void sheetBody.offsetWidth;
    sheetBody.classList.add("stagger");
  }
}

function closeSheet() {
  sheet.classList.remove("open");
  document.body.classList.remove("sheet-open");
}

function renderExplore() {
  const results = state.query ? searchPlaces(state.query) : nearbyPlaces();
  const meta = state.query ? results.length + " matches" : "nearest to view";

  // Destination card, as in the app: shown once a place is picked.
  const dest = state.destination ? (() => {
    const d = haversine({ lat: viewCentre().lat, lng: viewCentre().lng }, { lat: state.destination.y, lng: state.destination.x });
    return '<div class="section-label">Destination</div>' +
      '<div class="row"><div class="row__main">' +
      '<p class="row__title">' + escapeHtml(state.destination.n) + '</p>' +
      '<p class="row__sub">' + escapeHtml(state.destination.t) + ' · ' + formatDistance(d) + ' straight line</p></div>' +
      '<button class="btn small" data-copy="' + state.destination.y.toFixed(5) + ", " + state.destination.x.toFixed(5) + '">Copy</button>' +
      '<button class="btn small" data-save-dest="1">Save</button></div>' +
      '<div class="field"><div><div class="field__label">Profile</div>' +
      '<div class="field__hint">The app routes on device; this only records the choice</div></div>' +
      '<div>' + Object.entries(PROFILES).map(([id, label]) =>
        '<button class="btn small" data-profile="' + id + '"' +
        (state.profile === id ? ' style="background:var(--accent);color:#fff;border-color:transparent"' : '') +
        '>' + label + '</button>').join(" ") + '</div></div>';
  })() : "";

  const sampleInstalled = state.installed.includes("andorra");
  const sample = '<div class="section-label">Bundled sample</div>' +
    '<div class="row"><div class="row__main">' +
    '<p class="row__title">Andorra — routing + offline search</p>' +
    '<p class="row__sub">' + (sampleInstalled
      ? 'Installed. On the phone this is a pre-built routing graph plus the places pack, so routing works with the radio off.'
      : 'Ships inside the APK: a pre-built routing graph and the 256-place pack. No download needed.') + '</p></div>' +
    (sampleInstalled
      ? '<span class="badge">installed</span>'
      : '<button class="btn small primary" data-install-sample="1">Install</button>') + '</div>';

  if (!results.length) {
    openSheet("Explore", meta,
      dest + sample +
      '<div class="empty">No place in the bundled dataset matches “' + escapeHtml(state.query) + '”.<br>' +
      'The pack holds 256 real OSM places in Andorra — the same data the app indexes offline.</div>');
    return;
  }

  const rows = results.map((p) => {
    const sub = [p.t, p.distance != null ? formatDistance(p.distance) : null].filter(Boolean).join(" · ");
    return '<div class="row" data-fly="' + p.x + "," + p.y + '" data-pick="' + p.x + "," + p.y + "," + encodeURIComponent(p.n) + "," + p.t + '">' +
      '<div class="row__main"><p class="row__title">' + escapeHtml(p.n) + '</p>' +
      '<p class="row__sub">' + escapeHtml(sub) + '</p></div>' +
      '<span class="badge muted">' + escapeHtml(p.t) + '</span></div>';
  }).join("");

  openSheet("Explore", meta, dest + sample + '<div class="section-label">Places</div>' + rows +
    '<p class="note">Tap a place to fly to it and set it as the destination. This list comes from the ' +
    'same places pack the Android app ships for offline search, so it works with no network.</p>');
  showResultsOnMap(results);
}

    '<div class="row"><div class="row__main">' +

function renderDownloads() {
  const rows = REGIONS.map((r) => {
    const tiles = tilesForBounds(r, r.z0, r.z1);
    const size = estimateBytes(r);
    const isBundled = r.id === "andorra";
    const installed = state.installed.includes(r.id);
    return '<div class="row">' +
      '<div class="row__main" data-fly="' + ((r.e + r.w) / 2) + "," + ((r.n + r.s) / 2) + '">' +
      '<p class="row__title">' + escapeHtml(r.name) + '</p>' +
      '<p class="row__sub">' + escapeHtml(r.country) + ' · zooms ' + r.z0 + '–' + r.z1 + '</p></div>' +
      '<div class="row__meta">' + formatBytes(size) +
      '<span class="tiles">' + tiles.toLocaleString() + ' tiles</span></div>' +
      '<div class="row__actions">' +
      (installed
        ? '<span class="badge">installed</span><button class="btn small danger" data-uninstall="' + r.id + '">Delete</button>'
        : (isBundled
            ? '<span class="badge">bundled</span>'
            : '<button class="btn small" data-install="' + r.id + '">Download</button>')) +
      '</div></div>';
  }).join("");

  const usedMb = state.installed.length * 24;
  openSheet("Downloads", REGIONS.length + " regions",
    '<div class="field"><div><div class="field__label">Wi-Fi only</div>' +
    '<div class="field__hint">The app refuses mobile data when this is on</div></div>' +
    '<label class="switch"><input type="checkbox" id="set-wifi" ' + (state.wifiOnly ? "checked" : "") + '><span></span></label></div>' +

    'the app.</p>' +

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderTab(tab) {
  const prevIdx = TAB_ORDER.indexOf(state.tab), idx = TAB_ORDER.indexOf(tab);
  state.tab = tab;
  document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  navEl.style.setProperty("--i", idx);
  sheetBody.style.setProperty("--dir", Math.sign(idx - prevIdx));
  if (idx !== prevIdx) stretchPill();
  animateNext = true;
  ({ explore: renderExplore, navigate: renderNavigate, downloads: renderDownloads, saved: renderSaved, settings: renderSettings })[tab]();
}

document.querySelectorAll(".tab").forEach((btn) => {
  btn.addEventListener("click", () => {
    const alreadyOpen = sheet.classList.contains("open") && state.tab === btn.dataset.tab;
    if (alreadyOpen) { closeSheet(); return; }
    renderTab(btn.dataset.tab);
  });
});

const searchInput = document.getElementById("search");

searchInput.addEventListener("input", () => {

    if (state.tab !== "explore") renderTab("explore"); else renderExplore();

  if (map) map.easeTo({ pitch: state.threeD ? 55 : 0, bearing: state.threeD ? -18 : 0, duration: 620 });

document.getElementById("toggle-3d").addEventListener("click", () => {

document.getElementById("locate").addEventListener("click", () => {
  if (!navigator.geolocation) { toast("This browser has no location API"); return; }
  toast("Finding your position…");
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const { latitude, longitude, accuracy } = pos.coords;
      state.userLocation = { lat: latitude, lng: longitude, accuracy };
      if (userMarker) userMarker.remove();
      const el = document.createElement("div");
      el.style.cssText = "width:16px;height:16px;border-radius:50%;background:#0e7490;border:3px solid #fff;box-shadow:0 0 0 4px rgba(14,116,144,.25)";
      userMarker = new maplibregl.Marker({ element: el }).setLngLat([longitude, latitude]).addTo(map);
      map.flyTo({ center: [longitude, latitude], zoom: Math.max(map.getZoom(), 14), duration: 900 });
      toast("Your position · ±" + Math.round(accuracy) + " m");
    },
    (err) => toast(err.code === 1 ? "Location permission denied" : "Position unavailable"),
    { enableHighAccuracy: true, timeout: 10000 },
  );
});

/* delegated actions inside the sheet */
sheetBody.addEventListener("click", (e) => {
  const fly = e.target.closest("[data-fly]");
  if (fly) {
    const [lng, lat] = fly.dataset.fly.split(",").map(Number);
    if (map) map.flyTo({ center: [lng, lat], zoom: Math.max(map.getZoom(), 14), duration: 900 });
    else toast(lat.toFixed(4) + ", " + lng.toFixed(4));
    return;
  }
  const del = e.target.closest("[data-del]");
  if (del) {
    const i = Number(del.dataset.del);
    state.saved.splice(i, 1);
    localStorage.setItem("om.saved", JSON.stringify(state.saved));
    renderSaved();
    toast("Removed");
    return;
  }
  const pick = e.target.closest("[data-pick]");
  if (pick) {
    const [lng, lat, name, type] = pick.dataset.pick.split(",");
    state.destination = { n: decodeURIComponent(name), t: type, x: Number(lng), y: Number(lat) };
    renderExplore();
    return;
  }
  const copy = e.target.closest("[data-copy]");
  if (copy) { copyText(copy.dataset.copy); return; }

  const share = e.target.closest("[data-share]");
  if (share) {
    const [lat, lng] = share.dataset.share.split(",").map(Number);
    copyText(shareLink(lat, lng));
    return;
  }
  const install = e.target.closest("[data-install]");
  if (install) {
    setInstalled(install.dataset.install, true);
    renderDownloads();
    toast("Marked installed — the app caches the real tiles");
    return;
  }
  const uninstall = e.target.closest("[data-uninstall]");
  if (uninstall) {
    setInstalled(uninstall.dataset.uninstall, false);
    renderDownloads();
    toast("Removed");
    return;
  }
  if (e.target.closest("[data-install-sample]")) {
    setInstalled("andorra", true);
    renderExplore();
    toast("Sample region installed");
    return;
  }
  const profile = e.target.closest("[data-profile]");
  if (profile) {
    state.profile = profile.dataset.profile;
    (state.tab === "navigate" ? renderNavigate : renderExplore)();
    return;
  }
  const qBtn = e.target.closest("[data-quality]");
  if (qBtn) {
    state.quality = qBtn.dataset.quality;
    localStorage.setItem("om.quality", state.quality);
    rebuildStyle();
    renderSettings();
    return;
  }
  if (e.target.closest("[data-save-dest]") && state.destination) {
    const d = state.destination;
    const label = prompt("Label: Home, Work, School, or anything else", "Saved place");
    if (label === null) return;
    state.saved.push({ name: d.n, label: label || "Saved place", lat: d.y, lng: d.x });
    localStorage.setItem("om.saved", JSON.stringify(state.saved));
    toast("Saved to this browser");
    return;
  }
  if (e.target.id === "save-view") {
    const c = viewCentre();
    const label = prompt("Label: Home, Work, School, or anything else", SAVED_LABELS[3]);
    if (label === null) return;
    state.saved.push({ name: label || "Saved place", label: label || "Saved place", lat: c.lat, lng: c.lng });
    localStorage.setItem("om.saved", JSON.stringify(state.saved));
    renderSaved();
    toast("Saved to this browser");
  }
});

/* ---------------------------------- liquid glass motion ---------------------------------- */
(function () {
  const root = document.documentElement;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // light + depth follow the mouse, or the phone's tilt
  if (!reduce) {
    let tx = 0, ty = 0, raf = 0;
    const put = (x, y) => {
      tx = Math.max(-1, Math.min(1, x)); ty = Math.max(-1, Math.min(1, y));
      if (!raf) raf = requestAnimationFrame(() => {
        raf = 0;
        root.style.setProperty("--tx", tx.toFixed(3));
        root.style.setProperty("--ty", ty.toFixed(3));
      });
    };
    addEventListener("pointermove", (e) => {
      if (e.pointerType === "mouse") put((e.clientX / innerWidth - .5) * 2, (e.clientY / innerHeight - .5) * 2);
    }, { passive: true });
    addEventListener("deviceorientation", (e) => {
      if (e.gamma != null && e.beta != null) put(e.gamma / 25, (e.beta - 50) / 25);
    }, { passive: true });
  }

  // drag the sheet down to close it; it rubber-bands back if you let go early
  let startY = null, dy = 0;
  [sheet.querySelector(".sheet__grab"), sheet.querySelector(".sheet__head")].forEach((el) => {
    el.addEventListener("pointerdown", (e) => {
      startY = e.clientY; dy = 0;
      sheet.classList.add("dragging");
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener("pointermove", (e) => {
      if (startY == null) return;
      dy = e.clientY - startY;
      sheet.style.setProperty("--dy", (dy < 0 ? dy * .25 : dy) + "px");
    });
    const end = () => {
      if (startY == null) return;
      startY = null;
      sheet.classList.remove("dragging");
      sheet.style.removeProperty("--dy");
      if (dy > 90) closeSheet();
      dy = 0;
    };
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", end);
  });
})();

/* ---------------------------------- boot ---------------------------------- */

initMap();
apply3D();
// Fill the Explore list, but keep the sheet closed so the map stays visible on load.
setTimeout(() => { renderTab("explore"); closeSheet(); updateCoverageChip(); }, 300);
</script>
</body>
